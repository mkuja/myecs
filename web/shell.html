<!doctype html>
<!--
  Page shell for the WebAssembly build. Emscripten substitutes {{{ SCRIPT }}}
  with the loader for the generated .js/.wasm.

  Four jobs beyond hosting the canvas:
    1. gate startup behind a click, because browsers refuse to start audio
       until the user has interacted with the page;
    2. show load progress and any error, since a blank canvas is otherwise
       indistinguishable from a crash;
    3. poll /build-id so tools/web_dev.py can reload the page after a rebuild;
    4. carry the world across that reload -- snapshot to sessionStorage on the
       way out, hand it back to the new module on the way in (tier 2, see
       plan/11-web-dev-loop.md).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myecs</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14161c; color: #d8dce6;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { display: grid; place-items: center; }
  #frame { position: relative; }
  canvas {
    display: block; background: #0c0e13; border-radius: 4px;
    /* Keep the canvas crisp: the engine renders at its own resolution. */
    image-rendering: pixelated;
    max-width: 100vw; max-height: 100vh;
  }
  canvas:focus { outline: 2px solid #3d6ea8; }
  #veil {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(12, 14, 19, 0.92); text-align: center; cursor: pointer;
  }
  #veil.hidden { display: none; }
  #title { font-size: 20px; margin-bottom: 8px; }
  #hint { color: #8c93a6; }
  #status {
    position: fixed; left: 10px; bottom: 8px; color: #8c93a6; font-size: 12px;
  }
  #status.error { color: #e88a72; }
</style>
</head>
<body>

<div id="frame">
  <!-- tabindex so the canvas can take keyboard focus for game input -->
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="veil">
    <div>
      <div id="title">myecs</div>
      <div id="hint">click to start</div>
    </div>
  </div>
</div>
<div id="status">loading…</div>

<script>
  const canvas = document.getElementById('canvas');
  const veil = document.getElementById('veil');
  const status = document.getElementById('status');

  const setStatus = (text, isError) => {
    status.textContent = text;
    status.classList.toggle('error', !!isError);
  };

  // --- tier 2: state-preserving reload ------------------------------------
  // The world is snapshotted to JSON before the page reloads and fed back
  // afterwards, so a rebuild does not send the game back to its first frame.
  // See plan/11-web-dev-loop.md and engine/core/web_reload.h.
  //
  // sessionStorage rather than localStorage: a snapshot belongs to this tab
  // and this sitting, and it must not outlive the browser.
  const SNAPSHOT_KEY = 'myecs:snapshot';
  let snapshotStashed = false;

  // Called from C once the snapshot exists. The page owns the storage key;
  // the engine only hands over the string.
  const stashSnapshot = (json) => {
    try {
      sessionStorage.setItem(SNAPSHOT_KEY, json);
      snapshotStashed = true;
    } catch (e) {
      console.warn('snapshot not stored:', e); // quota, or storage disabled
    }
  };

  // Requests a snapshot and waits for a frame to deliver it. Asynchronous by
  // necessity: with ASYNCIFY the wasm stack is unwound between frames, so C
  // serves the request at the top of the next one rather than here -- see
  // engine/core/web_reload.h. Resolves false if no frame arrives, which is
  // the honest answer when the loop has stopped; the caller reloads anyway
  // and loses state, exactly as tier 1 always did.
  window.myeSnapshot = async () => {
    if (!Module._mye_web_snapshot) return false; // built without the engine
    snapshotStashed = false;
    Module.cwrap('mye_web_snapshot', 'number', [])();
    for (let i = 0; i < 100 && !snapshotStashed; ++i) {
      await new Promise((r) => setTimeout(r, 10));
    }
    return snapshotStashed;
  };

  // The other half: hand any stashed snapshot to the new module. Queued here
  // and applied by C one frame later, once mye_init has built the world and
  // the starting scene has loaded.
  const restoreSnapshot = () => {
    const json = sessionStorage.getItem(SNAPSHOT_KEY);
    if (json === null) return;
    // Cleared before it is used, not after: a snapshot the module chokes on
    // must not be re-applied on every load from here to eternity.
    sessionStorage.removeItem(SNAPSHOT_KEY);
    if (!Module._mye_web_restore) return;

    // Through the heap rather than cwrap's 'string', which would put the
    // whole snapshot on the 1 MB wasm stack.
    const size = Module.lengthBytesUTF8(json) + 1;
    const buffer = Module._malloc(size);
    if (!buffer) return;
    try {
      Module.stringToUTF8(json, buffer, size);
      Module.cwrap('mye_web_restore', 'number', ['number'])(buffer);
    } finally {
      Module._free(buffer);
    }
  };

  // Emscripten looks for this global.
  var Module = {
    canvas,
    print: (text) => console.log(text),
    printErr: (text) => {
      console.error(text);
      setStatus(text, true);
    },
    setStatus: (text) => setStatus(text || 'running'),
    // Fires before main(), so the world does not exist yet -- which is fine,
    // because the restore is a queue and C drains it at a frame boundary.
    onRuntimeInitialized: () => {
      setStatus('running');
      restoreSnapshot();
    },
    myeStashSnapshot: stashSnapshot,
  };

  window.onerror = (message) => setStatus('error: ' + message, true);

  // NEVER write emscripten's script placeholder token in this file outside
  // the one place it belongs -- not even inside a comment. It is substituted
  // by plain text replacement anywhere it appears, so a mention in a comment
  // expands to a <script> element that closes THIS one, and every line below
  // it silently becomes body text instead of code.
  //
  // The module is loaded by that placeholder as the page loads, so the veil
  // does not gate startup -- it gates the *user gesture*. Browsers suspend
  // audio until one happens, and the canvas needs focus or key input goes to
  // the page instead of the game.
  const start = () => {
    veil.classList.add('hidden');
    canvas.focus();
    // Resuming any suspended AudioContext is what the gesture is really for.
    if (window.AudioContext && Module.SDL2) { /* raylib/miniaudio handles it */ }
  };
  veil.addEventListener('click', start);
  veil.addEventListener('keydown', start);

  // Test seam, mirroring MYE_MAX_FRAMES/MYE_SCREENSHOT on the native builds:
  // ?autostart skips the gesture so a headless browser can reach the canvas.
  // Audio stays suspended -- browsers require a real gesture for that, and no
  // flag of ours can or should change it.
  if (new URLSearchParams(location.search).has('autostart')) start();

  // --- development reload -------------------------------------------------
  // tools/web_dev.py increments /build-id after each successful rebuild.
  // Polling rather than a WebSocket: ten lines instead of a dependency, and
  // the rebuild itself dwarfs the poll interval. Absent in production, where
  // the endpoint simply 404s and this quietly stops.
  (async () => {
    let known = null;
    for (;;) {
      try {
        const response = await fetch('/build-id', { cache: 'no-store' });
        if (!response.ok) return;
        const id = (await response.text()).trim();
        if (known === null) {
          known = id;
        } else if (id !== known) {
          setStatus('rebuilt — reloading');
          // Snapshot the world first, so the reload resumes rather than
          // restarts; see plan/11-web-dev-loop.md (tier 2).
          try { await window.myeSnapshot(); } catch (e) { console.warn(e); }
          location.reload();
          return;
        }
      } catch (e) {
        return; // not served by the dev server
      }
      await new Promise((r) => setTimeout(r, 500));
    }
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
